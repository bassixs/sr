<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Калужский санаторий Звездный</title>
    <script>
      // SPA-редирект для GitHub Pages: сохраняем запрошенный путь в query-строке
      // и уходим на index.html, где путь восстанавливается. base = '/sr/' -> храним 1 сегмент.
      (function () {
        var pathSegmentsToKeep = 1;
        var l = window.location;
        l.replace(
          l.protocol +
            '//' +
            l.hostname +
            (l.port ? ':' + l.port : '') +
            l.pathname
              .split('/')
              .slice(0, 1 + pathSegmentsToKeep)
              .join('/') +
            '/?/' +
            l.pathname
              .slice(1)
              .split('/')
              .slice(pathSegmentsToKeep)
              .join('/')
              .replace(/&/g, '~and~') +
            (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
            l.hash
        );
      })();
    </script>
  </head>
  <body></body>
</html>
